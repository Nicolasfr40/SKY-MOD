<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>SKY MOD - IPTV Luxury</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Montserrat:wght@300;400;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background: #0a0a0a;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            -webkit-overflow-scrolling: touch;
            touch-action: manipulation;
        }

        @media (orientation: landscape) and (max-height: 600px) {
            html, body {
                height: auto !important;
                min-height: 100vh;
                overflow-y: auto !important;
                overflow-x: hidden !important;
            }
            .top-bar { padding: 8px 16px 4px 16px !important; }
            .logo-sky .nome { font-size: 20px !important; }
            .logo-sky .sub { font-size: 8px !important; letter-spacing: 2px !important; }
            .top-bar .status { font-size: 9px !important; }
            .gold-line { margin-bottom: 2px !important; }
            .player-container { flex: 0 0 auto !important; padding: 6px 12px !important; min-height: auto !important; }
            .player-wrapper { max-height: 80vh !important; height: 80vh !important; }
            .player-wrapper iframe, .player-wrapper video { min-height: 200px !important; height: 80vh !important; }
            .footer-bar { padding: 4px 16px 8px 16px !important; }
            .footer-bar .info, .footer-bar .brand { font-size: 9px !important; }
            #btnCanais { width: 48px !important; height: 48px !important; font-size: 20px !important; bottom: 12px !important; right: 12px !important; }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(180,0,0,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(180,0,0,0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(100,0,0,0.12) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .bg-pattern {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(255,215,0,0.01) 0px, rgba(255,215,0,0.01) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== SPLASH ===== */
        .splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
            animation: splashOut 1.2s ease forwards;
            animation-delay: 3.5s;
        }
        .splash-screen .bg-effects { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .light-1 { position: absolute; top: 50%; left: 50%; width: 80%; height: 80%; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(255,26,26,0.15) 0%, transparent 70%); animation: lightPulse1 3s ease-in-out infinite; }
        .light-2 { position: absolute; top: 20%; right: 10%; width: 40%; height: 40%; background: radial-gradient(ellipse at center, rgba(255,26,26,0.1) 0%, transparent 70%); animation: lightPulse2 4s ease-in-out infinite; }
        .light-3 { position: absolute; bottom: 10%; left: 5%; width: 50%; height: 30%; background: radial-gradient(ellipse at center, rgba(255,26,26,0.08) 0%, transparent 70%); animation: lightPulse3 5s ease-in-out infinite; }
        .line { position: absolute; background: linear-gradient(90deg, transparent, rgba(255,26,26,0.2), transparent); height: 1px; width: 60%; left: 20%; }
        .line-1 { top: 15%; animation: lineMove1 6s linear infinite; }
        .line-2 { top: 85%; animation: lineMove2 8s linear infinite; }
        .line-3 { top: 50%; width: 40%; left: 30%; opacity: 0.5; animation: lineMove3 7s linear infinite; }
        .particle { position: absolute; width: 3px; height: 3px; background: rgba(255,26,26,0.6); border-radius: 50%; box-shadow: 0 0 10px rgba(255,26,26,0.3); animation: particleFloat 8s ease-in-out infinite; }
        .particle:nth-child(1) { top: 10%; left: 20%; }
        .particle:nth-child(2) { top: 30%; left: 80%; animation-delay: 1s; }
        .particle:nth-child(3) { top: 60%; left: 10%; animation-delay: 2s; }
        .particle:nth-child(4) { top: 80%; left: 70%; animation-delay: 0.5s; }
        .particle:nth-child(5) { top: 20%; left: 50%; animation-delay: 1.5s; }

        .logo-splash { position: relative; z-index: 2; text-align: center; opacity: 0; animation: logoReveal 1.2s ease forwards; animation-delay: 0.5s; }
        .logo-splash .nome { font-family: 'Playfair Display', serif; font-size: 72px; font-weight: 700; font-style: italic; color: #fff; letter-spacing: 6px; text-shadow: 0 0 40px rgba(255,26,26,0.15), 0 0 80px rgba(255,26,26,0.08); animation: textGlow 3s ease-in-out infinite; }
        .logo-splash .nome .mod-destaque { color: #ff1a1a; text-shadow: 0 0 60px rgba(255,26,26,0.4); }
        .logo-splash .underline { width: 0; height: 2px; background: linear-gradient(90deg, transparent, #ff1a1a, transparent); margin: 12px auto 0 auto; animation: underlineGrow 1.5s ease forwards; animation-delay: 1.2s; }
        .logo-splash .sub { font-size: 13px; font-weight: 300; letter-spacing: 8px; color: rgba(255,255,255,0.5); text-transform: uppercase; margin-top: 16px; opacity: 0; animation: fadeUp 0.8s ease forwards; animation-delay: 1.8s; }

        @keyframes logoReveal { 0% { opacity: 0; transform: scale(0.8) translateY(30px); filter: blur(8px); } 60% { transform: scale(1.05) translateY(-5px); filter: blur(0); } 100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
        @keyframes textGlow { 0%, 100% { text-shadow: 0 0 40px rgba(255,26,26,0.15); } 50% { text-shadow: 0 0 60px rgba(255,26,26,0.25); } }
        @keyframes underlineGrow { 0% { width: 0; opacity: 0; } 100% { width: 40%; opacity: 1; } }
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes lightPulse1 { 0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; } 50% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; } }
        @keyframes lightPulse2 { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 0.8; } }
        @keyframes lightPulse3 { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.4); opacity: 0.7; } }
        @keyframes lineMove1 { 0% { transform: translateX(-100%); opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateX(100%); opacity: 0; } }
        @keyframes lineMove2 { 0% { transform: translateX(100%); opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateX(-100%); opacity: 0; } }
        @keyframes lineMove3 { 0% { transform: translateX(-50%) scaleX(0.5); opacity: 0; } 50% { opacity: 0.5; } 100% { transform: translateX(50%) scaleX(1.5); opacity: 0; } }
        @keyframes particleFloat { 0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; } 50% { transform: translateY(-60px) scale(1.5); opacity: 1; } }
        @keyframes splashOut { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); visibility: hidden; } }

        /* ===== TOPO ===== */
        .top-bar {
            width: 100%;
            max-width: 1200px;
            padding: 14px 24px 8px 24px;
            padding-top: calc(14px + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 2;
            position: relative;
        }
        .logo-sky { display: flex; align-items: center; gap: 12px; }
        .logo-sky .icon { font-size: 28px; color: #ff1a1a; text-shadow: 0 0 30px rgba(255,26,26,0.3); }
        .logo-sky .nome { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; font-style: italic; color: #fff; letter-spacing: 3px; }
        .logo-sky .nome span { color: #ff1a1a; }
        .logo-sky .sub { font-size: 9px; font-weight: 300; letter-spacing: 4px; color: #888; text-transform: uppercase; margin-left: 4px; border-left: 1px solid #333; padding-left: 10px; }
        .top-bar .status { font-size: 11px; color: #666; letter-spacing: 2px; text-transform: uppercase; }
        .top-bar .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00ff88; margin-right: 8px; box-shadow: 0 0 20px rgba(0,255,136,0.3); animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

        .gold-line {
            width: 100%;
            max-width: 1200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), #ff1a1a, rgba(255,215,0,0.3), transparent);
            flex-shrink: 0;
            z-index: 2;
            position: relative;
            margin-bottom: 4px;
        }

        .tabs { position: absolute !important; left: -9999px !important; top: -9999px !important; opacity: 0 !important; pointer-events: none !important; height: 0 !important; overflow: hidden !important; }

        /* ===== PLAYER ===== */
        .player-container {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            padding: 6px 16px 16px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            position: relative;
            overflow: hidden;
        }

        .player-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(255, 26, 26, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 70%, rgba(255, 26, 26, 0.1) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(180, 0, 0, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
            animation: ledPulse 4s ease-in-out infinite;
        }

        .player-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 200%; height: 100%;
            background-image: repeating-linear-gradient(90deg, transparent 0px, transparent 80px, rgba(255, 26, 26, 0.05) 80px, rgba(255, 26, 26, 0.05) 82px);
            pointer-events: none;
            z-index: 0;
            animation: ledScroll 8s linear infinite;
        }

        @keyframes ledPulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
        @keyframes ledScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .light-orbs { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .light-orbs::before, .light-orbs::after { content: ''; position: absolute; border-radius: 50%; filter: blur(60px); animation: orbFloat 10s ease-in-out infinite; }
        .light-orbs::before { width: 200px; height: 200px; background: rgba(255, 26, 26, 0.15); top: 10%; left: 10%; animation-delay: 0s; }
        .light-orbs::after { width: 250px; height: 250px; background: rgba(255, 26, 26, 0.1); bottom: 10%; right: 10%; animation-delay: 3s; }
        @keyframes orbFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(40px, -30px) scale(1.1); } 50% { transform: translate(-30px, 40px) scale(0.95); } 75% { transform: translate(30px, 30px) scale(1.05); } }

        .player-wrapper {
            width: 100%;
            height: 100%;
            max-height: 80vh;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 60px rgba(255,26,26,0.15), 0 20px 60px rgba(0,0,0,0.9);
            position: relative;
            border: 1px solid rgba(255,215,0,0.08);
            z-index: 2;
        }
        .player-wrapper::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,215,0,0.15), transparent 40%, transparent 60%, rgba(255,26,26,0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 5;
        }
        .player-wrapper iframe,
        .player-wrapper video {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border: none;
            display: block;
            background: #000;
        }
        .player-wrapper.oculto { display: none; }
        .player-wrapper .player-overlay {
            position: absolute;
            bottom: 20px;
            right: 24px;
            z-index: 4;
            font-family: 'Playfair Display', serif;
            font-size: 11px;
            font-style: italic;
            color: rgba(255,255,255,0.06);
            letter-spacing: 6px;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* ===== OVERLAY DE CLIQUES (INVISÍVEL) ===== */
        .click-catcher {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            background: transparent;
            cursor: pointer;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== RODAPÉ ===== */
        .footer-bar {
            width: 100%;
            max-width: 1200px;
            padding: 4px 24px 12px 24px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 2;
            position: relative;
        }
        .footer-bar .info { font-size: 10px; color: #333; letter-spacing: 1px; text-transform: uppercase; }
        .footer-bar .info span { color: #ff1a1a; }
        .footer-bar .brand { font-family: 'Playfair Display', serif; font-size: 12px; font-style: italic; color: #222; letter-spacing: 2px; }

        /* ===== ERRO / LOADING ===== */
        .erro-msg { display: flex; align-items: center; justify-content: center; height: 100%; min-height: 400px; color: #ff6b6b; font-size: 18px; text-align: center; padding: 30px; flex-direction: column; gap: 14px; font-family: 'Montserrat', sans-serif; }
        .erro-msg .icone { font-size: 56px; }
        .erro-msg .titulo { font-size: 20px; font-weight: 700; color: #fff; }
        .erro-msg .descricao { font-size: 14px; color: #888; max-width: 500px; }

        .loading-player { display: flex; align-items: center; justify-content: center; height: 100%; min-height: 400px; flex-direction: column; gap: 20px; color: #666; font-family: 'Montserrat', sans-serif; }
        .loading-player .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,26,26,0.2); border-top-color: #ff1a1a; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-player .texto { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }

        /* ===== BOTÃO FULLSCREEN ===== */
        .btn-fullscreen {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 20;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid rgba(0, 255, 136, 0.6);
            color: #00ff88;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .btn-fullscreen.escondido {
            opacity: 0 !important;
            transform: scale(0.5) !important;
            pointer-events: none !important;
        }

        .btn-fullscreen:hover {
            background: rgba(0, 255, 136, 0.25);
            border-color: #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.6);
            transform: scale(1.1);
        }

        .btn-fullscreen:active { transform: scale(0.9); }

        .btn-fullscreen svg { width: 24px; height: 24px; fill: currentColor; }

        /* ===== FULLSCREEN TOTAL ===== */
        .player-wrapper.fullscreen-ativo {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-height: 100vh !important;
            max-width: 100vw !important;
            z-index: 999999 !important;
            border-radius: 0 !important;
            border: none !important;
            background: #000 !important;
            padding: 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
        }

        .player-wrapper.fullscreen-ativo::before { display: none !important; }

        .player-wrapper.fullscreen-ativo iframe,
        .player-wrapper.fullscreen-ativo video {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            min-height: 100vh !important;
            object-fit: contain !important;
            background: #000 !important;
        }

        body.fullscreen-ativo { overflow: hidden !important; position: fixed !important; width: 100% !important; height: 100% !important; top: 0 !important; left: 0 !important; }

        body.fullscreen-ativo .top-bar,
        body.fullscreen-ativo .gold-line,
        body.fullscreen-ativo .footer-bar,
        body.fullscreen-ativo .tabs,
        body.fullscreen-ativo .bg-pattern,
        body.fullscreen-ativo::before { display: none !important; }

        body.fullscreen-ativo .player-container {
            padding: 0 !important;
            margin: 0 !important;
            flex: none !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            z-index: 999999 !important;
        }

        body.fullscreen-ativo .light-orbs { display: none !important; }
        body.fullscreen-ativo #btnCanais { display: none !important; }

        body.fullscreen-ativo .player-wrapper.fullscreen-ativo .btn-fullscreen {
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border-color: #ff1a1a;
            color: #ff1a1a;
            box-shadow: 0 0 30px rgba(255, 26, 26, 0.5);
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 600px) {
            .logo-sky .nome { font-size: 18px; }
            .logo-sky .sub { font-size: 7px; padding-left: 6px; letter-spacing: 2px; }
            .player-wrapper iframe, .player-wrapper video { min-height: 200px; }
            .player-container { padding: 4px 8px 8px 8px; }
            .top-bar { padding: 10px 16px 4px 16px; padding-top: calc(10px + env(safe-area-inset-top)); }
            .top-bar .status { font-size: 8px; letter-spacing: 1px; }
            .top-bar .status .dot { width: 6px; height: 6px; margin-right: 4px; }
            .footer-bar .info { font-size: 8px; }
            .footer-bar .brand { font-size: 9px; }
            .player-wrapper .player-overlay { font-size: 8px; bottom: 12px; right: 16px; letter-spacing: 3px; }
            .logo-splash .nome { font-size: 40px; letter-spacing: 4px; }
            .logo-splash .sub { font-size: 10px; letter-spacing: 5px; }
            .logo-splash .underline { width: 60%; }
            .erro-msg { min-height: 250px; padding: 20px; }
            .erro-msg .icone { font-size: 40px; }
            .erro-msg .titulo { font-size: 16px; }
            .erro-msg .descricao { font-size: 12px; }
            .btn-fullscreen { width: 42px; height: 42px; top: 12px; right: 12px; }
            .btn-fullscreen svg { width: 20px; height: 20px; }
        }

        @media (max-width: 400px) {
            .logo-sky .nome { font-size: 14px; }
            .logo-sky .icon { font-size: 18px; }
            .logo-sky .sub { display: none; }
            .logo-splash .nome { font-size: 30px; letter-spacing: 3px; }
            .logo-splash .sub { font-size: 8px; letter-spacing: 3px; }
        }

        /* ===== GAVETA DE CANAIS ===== */
        #btnCanais {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom));
            right: 24px;
            z-index: 9998;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #000;
            border: 2px solid #00ff88;
            color: #00ff88;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4), 0 0 40px rgba(0, 255, 136, 0.2);
            transition: all 0.3s ease;
            animation: pulseLive 2s ease-in-out infinite;
        }
        #btnCanais:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(0, 255, 136, 0.6), 0 0 60px rgba(0, 255, 136, 0.3); }
        #btnCanais.ativo { background: #00ff88; color: #000; }
        #btnCanais .icone { transition: transform 0.3s ease; }
        #btnCanais.ativo .icone { transform: rotate(90deg); }
        @keyframes pulseLive { 0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4), 0 0 40px rgba(0, 255, 136, 0.2); } 50% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.7), 0 0 60px rgba(0, 255, 136, 0.4); } }

        #gavetaCanais {
            position: fixed;
            top: 0;
            right: -100%;
            width: 320px;
            max-width: 85%;
            height: 100vh;
            background: #0a0a0a;
            z-index: 999997;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.9);
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(0, 255, 136, 0.15);
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        #gavetaCanais.aberta { right: 0; }

        .gaveta-header { padding: 20px 24px; border-bottom: 1px solid rgba(255, 215, 0, 0.1); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; position: relative; overflow: hidden; }

        @media (max-width: 600px) {
            #btnCanais { width: 56px; height: 56px; font-size: 24px; bottom: calc(20px + env(safe-area-inset-bottom)); right: 20px; }

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

    <script>
        (function() {
            'use strict';

            const CANAIS = {
                sbt: { nome: 'SBT', url: 'https://www.youtube.com/embed/LLpNUqHVam8?autoplay=1&controls=1&rel=0&modestbranding=1&showinfo=0&iv_load_policy=3' },
                redetv: { nome: 'Rede TV', url: 'https://geo.dailymotion.com/player/xgrus.html?video=kYe5OYErhldJ75Azib2&autoplay=1' },
                cultura: { nome: 'TV Cultura', url: 'https://player-tvcultura.stream.uol.com.br/live/tvcultura.m3u8', tipo: 'hls', headers: { 'Referer': 'https://www.cxtv.com.br/', 'Origin': 'https://www.cxtv.com.br' } },
                globo: { nome: 'GLOBO', url: 'https://megaflix.mgfiles.lat/ea4564eea5c614876989b6fd90ba4700/file.m3u8', tipo: 'hls' },
                canal: { nome: 'CANAL', url: 'https://www.youtube.com/embed/rEKifG2XUZg?autoplay=true' }
            };

            function detectarTipoPlayer(url) {
                if (!url) return 'desconhecido';
                const u = url.toLowerCase();
                if (u.includes('youtube.com/embed') || u.includes('youtu.be') || u.includes('youtube.com/watch')) return 'youtube';
                if (u.includes('dailymotion.com')) return 'dailymotion';
                if (u.includes('vimeo.com')) return 'vimeo';
                if (u.includes('.m3u8')) return 'hls';
                if (u.includes('.ts') && !u.includes('test')) return 'hls';
                if (u.match(/\.(mp4|webm|mkv|mov|m4v|ogv)(\?|$)/)) return 'video';
                if (u.match(/\.(m3u|pls)(\?|$)/)) return 'hls';
                if (u.includes('twitter.com') || u.includes('x.com')) return 'twitter';
                if (u.includes('twitch.tv')) return 'twitch';
                if (u.includes('facebook.com')) return 'facebook';
                if (u.includes('instagram.com')) return 'instagram';
                if (u.includes('tiktok.com')) return 'tiktok';
                if (u.includes('/embed') || u.includes('/player') || u.match(/\.(html|php)(\?|$)/)) return 'iframe';
                return 'iframe';
            }

            function criarPlayerUniversal(abaId, container) {
                const config = CANAIS[abaId];
                if (!config) return null;

                const url = config.url;
                const tipo = config.tipo || detectarTipoPlayer(url);

                container.innerHTML = '';

                const loading = document.createElement('div');
                loading.className = 'loading-player';
                loading.innerHTML = `<div class="spinner"></div><div class="texto">Carregando ${config.nome}...</div>`;
                container.appendChild(loading);

                const overlay = document.createElement('div');
                overlay.className = 'player-overlay';
                overlay.textContent = '✦ LIVE';

                let playerElement = null;

                try {
                    switch (tipo) {
                        case 'hls': playerElement = criarPlayerHLS(url, config, container); break;
                        case 'video': playerElement = criarPlayerVideo(url, config); break;
                        default: playerElement = criarIframe(url, config);
                    }

                    if (playerElement) {
                        container.innerHTML = '';
                        container.appendChild(overlay);
                        container.appendChild(playerElement);
                        adicionarBotaoFullscreen(container);
                        adicionarClickCatcher(container);
                    }
                } catch (erro) {
                    console.error('Erro ao criar player:', erro);
                    mostrarErro(container, config, erro.message);
                }
            }

            function criarIframe(url, config) {
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write';
                iframe.allowFullscreen = true;
                iframe.loading = 'lazy';
                iframe.setAttribute('frameborder', '0');
                iframe.setAttribute('scrolling', 'no');
                return iframe;
            }

            function criarPlayerHLS(url, config, container) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.muted = false;
                video.playsInline = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.background = '#000';
                video.style.objectFit = 'contain';

                const suporteNativoHLS = video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('application/x-mpegURL');

                if (suporteNativoHLS && !window.Hls) {
                    video.src = url;
                } else if (window.Hls && window.Hls.isSupported()) {
                    const hls = new Hls({
                        enableWorker: true, lowLatencyMode: true, backBufferLength: 90,
                        maxBufferLength: 30, maxMaxBufferLength: 60,
                        manifestLoadingTimeOut: 10000, manifestLoadingMaxRetry: 3,
                        levelLoadingTimeOut: 10000, levelLoadingMaxRetry: 3,
                        fragLoadingTimeOut: 20000, fragLoadingMaxRetry: 4,
                        xhrSetup: function(xhr, u) {
                            if (config.headers) {
                                Object.keys(config.headers).forEach(key => {
                                    try { xhr.setRequestHeader(key, config.headers[key]); } catch (e) {}
                                });
                            }
                            xhr.withCredentials = false;
                        }
                    });

                    hls.loadSource(url);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play().catch(function(e) {}); });
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                                case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                                default:
                                    hls.destroy();
                                    mostrarErro(container, config, 'Não foi possível carregar a transmissão.');
                                    break;
                            }
                        }
                    });

                    video._hls = hls;
                } else {
                    video.src = url;
                }

                video.addEventListener('error', function() {
                    mostrarErro(container, config, 'Erro ao carregar o vídeo.');
                });

                return video;
            }

            function criarPlayerVideo(url, config) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.muted = false;
                video.playsInline = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.background = '#000';
                video.style.objectFit = 'contain';
                video.src = url;
                return video;
            }

            function mostrarErro(container, config, mensagem) {
                const overlay = document.createElement('div');
                overlay.className = 'player-overlay';
                overlay.textContent = '✦ LIVE';

                const erro = document.createElement('div');
                erro.className = 'erro-msg';
                erro.innerHTML = `
                    <div class="icone">📡</div>
                    <div class="titulo">${config.nome} indisponível</div>
                    <div class="descricao">${mensagem || 'A transmissão não pôde ser carregada.'}</div>
                `;

                container.innerHTML = '';
                container.appendChild(overlay);
                container.appendChild(erro);
            }

            const botoes = document.querySelectorAll('#tabButtons button');
            const containers = {
                sbt: document.getElementById('player-sbt'),
                redetv: document.getElementById('player-redetv'),
                cultura: document.getElementById('player-cultura'),
                globo: document.getElementById('player-globo'),
                canal: document.getElementById('player-canal')
            };

            function trocarAba(abaId) {
                const containerAtual = containers[abaId];
                if (!containerAtual) return;

                const outros = Object.keys(containers).filter(k => k !== abaId);

                const playerExistente = containerAtual.querySelector('iframe, video');
                if (!playerExistente) {
                    criarPlayerUniversal(abaId, containerAtual);
                }

                containerAtual.classList.remove('oculto');

                outros.forEach(key => {
                    const outro = containers[key];
                    if (!outro) return;
                    outro.classList.add('oculto');

                    const player = outro.querySelector('iframe, video');
                    if (player) {
                        if (player.tagName === 'VIDEO') {
                            try {
                                player.pause();
                                if (player._hls) { player._hls.destroy(); player._hls = null; }
                            } catch (e) {}
                        } else if (player.tagName === 'IFRAME') {
                            try { player.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*'); } catch (e) {}
                        }
                        player.remove();
                    }
                });

                botoes.forEach(btn => {
                    btn.classList.toggle('ativa', btn.dataset.tab === abaId);
                });
            }

            botoes.forEach(btn => {
                btn.addEventListener('click', function() {
                    trocarAba(this.dataset.tab);
                });
            });

            window.trocarAbaGlobal = trocarAba;

            // ============================================================
            // FULLSCREEN + TOGGLE DO BOTÃO
            // ============================================================
            const ICONE_EXPANDIR = `<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>`;
            const ICONE_SAIR = `<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>`;

            let fullscreenAtivo = null;
            const timeoutsEsconder = {};

            function adicionarBotaoFullscreen(wrapper) {
                if (wrapper.querySelector('.btn-fullscreen')) return;

                const btn = document.createElement('button');
                btn.className = 'btn-fullscreen';
                btn.setAttribute('aria-label', 'Tela cheia');
                btn.setAttribute('title', 'Tela cheia');
                btn.innerHTML = ICONE_EXPANDIR;

                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    toggleFullscreen(wrapper);
                });

                // Também suporta toque (mobile)
                btn.addEventListener('touchend', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    toggleFullscreen(wrapper);
                });

                wrapper.appendChild(btn);
            }

            function adicionarClickCatcher(wrapper) {
                if (wrapper.querySelector('.click-catcher')) return;

                const overlay = document.createElement('div');
                overlay.className = 'click-catcher';

                overlay.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    toggleBotao(wrapper);
                });

                overlay.addEventListener('touchend', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    toggleBotao(wrapper);
                });

                // Insere antes do botão fullscreen (pra ficar por baixo)
                const btnFs = wrapper.querySelector('.btn-fullscreen');
                if (btnFs) {
                    wrapper.insertBefore(overlay, btnFs);
                } else {
                    wrapper.appendChild(overlay);
                }
            }

            function toggleBotao(wrapper) {
                const btn = wrapper.querySelector('.btn-fullscreen');
                if (!btn) return;

                // Se tá escondido → mostra
                if (btn.classList.contains('escondido')) {
                    btn.classList.remove('escondido');
                    agendarEsconder(wrapper, btn);
                } else {
                    // Se tá visível → esconde
                    btn.classList.add('escondido');
                    if (timeoutsEsconder[wrapper.id]) {
                        clearTimeout(timeoutsEsconder[wrapper.id]);
                        delete timeoutsEsconder[wrapper.id];
                    }
                }
            }

            function agendarEsconder(wrapper, btn) {
                if (timeoutsEsconder[wrapper.id]) {
                    clearTimeout(timeoutsEsconder[wrapper.id]);
                }

                timeoutsEsconder[wrapper.id] = setTimeout(function() {
                    btn.classList.add('escondido');
                    delete timeoutsEsconder[wrapper.id];
                }, 3000);
            }

            function toggleFullscreen(wrapper) {
                const estaAtivo = wrapper.classList.contains('fullscreen-ativo');

                if (estaAtivo) {
                    wrapper.classList.remove('fullscreen-ativo');
                    document.body.classList.remove('fullscreen-ativo');
                    fullscreenAtivo = null;

                    const btn = wrapper.querySelector('.btn-fullscreen');
                    if (btn) {
                        btn.innerHTML = ICONE_EXPANDIR;
                        btn.classList.remove('escondido');
                        agendarEsconder(wrapper, btn);
                    }

                    if (document.fullscreenElement) {
                        document.exitFullscreen().catch(() => {});
                    }
                } else {
                    wrapper.classList.add('fullscreen-ativo');
                    document.body.classList.add('fullscreen-ativo');
                    fullscreenAtivo = wrapper;

                    const btn = wrapper.querySelector('.btn-fullscreen');
                    if (btn) {
                        btn.innerHTML = ICONE_SAIR;
                        btn.classList.remove('escondido');
                        agendarEsconder(wrapper, btn);
                    }

                    if (wrapper.requestFullscreen) {
                        wrapper.requestFullscreen().catch(function(err) {
                            console.log('Fullscreen nativo bloqueado:', err.message);
                        });
                    }
                }
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && fullscreenAtivo) {
                    toggleFullscreen(fullscreenAtivo);
                }
            });

            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement && fullscreenAtivo) {
                    const wrapper = fullscreenAtivo;
                    wrapper.classList.remove('fullscreen-ativo');
                    document.body.classList.remove('fullscreen-ativo');
                    fullscreenAtivo = null;

                    const btn = wrapper.querySelector('.btn-fullscreen');
                    if (btn) {
                        btn.innerHTML = ICONE_EXPANDIR;
                        btn.classList.remove('escondido');
                        agendarEsconder(wrapper, btn);
                    }
                }
            });

            function adicionarTudoTodos() {
                document.querySelectorAll('.player-wrapper').forEach(function(w) {
                    adicionarBotaoFullscreen(w);
                    adicionarClickCatcher(w);
                });
            }

            setTimeout(() => {
                trocarAba('sbt');
                adicionarTudoTodos();
            }, 200);

            setTimeout(adicionarTudoTodos, 1500);

        })();
    </script>

    <!-- GAVETA -->
    <script>
    (function() {
        'use strict';

        const btnCanais = document.getElementById('btnCanais');
        const gaveta = document.getElementById('gavetaCanais');
        const overlay = document.getElementById('gavetaOverlay');
        const lista = document.getElementById('gavetaLista');
        const total = document.getElementById('gavetaTotal');
        const btnClose = gaveta.querySelector('.gaveta-close');

        function detectarCanais() {
            const botoes = document.querySelectorAll('#tabButtons button');
            lista.innerHTML = '';

            botoes.forEach(function(btn) {
                const tabId = btn.dataset.tab;
                const numero = btn.querySelector('.numero') ? btn.querySelector('.numero').textContent.trim() : '';
                const nome = btn.textContent.replace(numero, '').trim();

                const item = document.createElement('div');
                item.className = 'gaveta-item';
                item.dataset.tab = tabId;

                item.innerHTML = `
                    <span class="numero">${numero}</span>
                    <span class="nome">${nome}</span>
                    <span class="live-badge">● LIVE</span>
                `;

                item.addEventListener('click', function() {
                    const aba = this.dataset.tab;
                    if (typeof window.trocarAbaGlobal === 'function') {
                        window.trocarAbaGlobal(aba);
                    } else {
                        const btnOriginal = document.querySelector(`#tabButtons button[data-tab="${aba}"]`);
                        if (btnOriginal) btnOriginal.click();
                    }
                    fecharGaveta();
                });

                lista.appendChild(item);
            });

            total.textContent = botoes.length;
        }

        function sincronizarAtivo() {
            const btnAtivo = document.querySelector('#tabButtons button.ativa');
            if (!btnAtivo) return;
            const abaAtiva = btnAtivo.dataset.tab;
            lista.querySelectorAll('.gaveta-item').forEach(function(item) {
                item.classList.toggle('ativo', item.dataset.tab === abaAtiva);
            });
        }

        function abrirGaveta() {
            gaveta.classList.add('aberta');
            overlay.classList.add('ativo');
            btnCanais.classList.add('ativo');
            sincronizarAtivo();
        }

        function fecharGaveta() {
            gaveta.classList.remove('aberta');
            overlay.classList.remove('ativo');
            btnCanais.classList.remove('ativo');
        }

        function toggleGaveta() {
            if (gaveta.classList.contains('aberta')) fecharGaveta();
            else abrirGaveta();
        }

        btnCanais.addEventListener('click', toggleGaveta);
        btnClose.addEventListener('click', fecharGaveta);
        overlay.addEventListener('click', fecharGaveta);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && gaveta.classList.contains('aberta')) fecharGaveta();
        });

        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
                if (m.attributeName === 'class') sincronizarAtivo();
            });
        });

        function observarBotoes() {
            document.querySelectorAll('#tabButtons button').forEach(function(btn) {
                observer.observe(btn, { attributes: true, attributeFilter: ['class'] });
            });
        }

        function init() {
            detectarCanais();
            observarBotoes();
            sincronizarAtivo();

            const observerDOM = new MutationObserver(function() {
                detectarCanais();
                observarBotoes();
            });

            const tabsContainer = document.getElementById('tabButtons');
            if (tabsContainer) {
                observerDOM.observe(tabsContainer, { childList: true });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            setTimeout(init, 500);
        }
    })();
    </script>

</body>
</html>
