<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>SKY MOD - IPTV Luxury</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Montserrat:wght@300;400;600;700;800&family=Rajdhani:wght@400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html { height: 100%; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }

        body {
            background: #000;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            color: #f2f2f2;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(180,0,0,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(180,0,0,0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(100,0,0,0.12) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== SPLASH ===== */
        .splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
            animation: splashOut 1.2s ease forwards;
            animation-delay: 3.5s;
        }
        .splash-screen .bg-effects { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .light-1 { position: absolute; top: 50%; left: 50%; width: 80%; height: 80%; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(255,26,26,0.15) 0%, transparent 70%); animation: lightPulse1 3s ease-in-out infinite; }
        .light-2 { position: absolute; top: 20%; right: 10%; width: 40%; height: 40%; background: radial-gradient(ellipse at center, rgba(255,26,26,0.1) 0%, transparent 70%); animation: lightPulse2 4s ease-in-out infinite; }
        .light-3 { position: absolute; bottom: 10%; left: 5%; width: 50%; height: 30%; background: radial-gradient(ellipse at center, rgba(255,26,26,0.08) 0%, transparent 70%); animation: lightPulse3 5s ease-in-out infinite; }
        .line { position: absolute; background: linear-gradient(90deg, transparent, rgba(255,26,26,0.2), transparent); height: 1px; width: 60%; left: 20%; }
        .line-1 { top: 15%; animation: lineMove1 6s linear infinite; }
        .line-2 { top: 85%; animation: lineMove2 8s linear infinite; }
        .line-3 { top: 50%; width: 40%; left: 30%; opacity: 0.5; animation: lineMove3 7s linear infinite; }
        .particle { position: absolute; width: 3px; height: 3px; background: rgba(255,26,26,0.6); border-radius: 50%; box-shadow: 0 0 10px rgba(255,26,26,0.3); animation: particleFloat 8s ease-in-out infinite; }
        .particle:nth-child(1) { top: 10%; left: 20%; }
        .particle:nth-child(2) { top: 30%; left: 80%; animation-delay: 1s; }
        .particle:nth-child(3) { top: 60%; left: 10%; animation-delay: 2s; }
        .particle:nth-child(4) { top: 80%; left: 70%; animation-delay: 0.5s; }
        .particle:nth-child(5) { top: 20%; left: 50%; animation-delay: 1.5s; }

        .logo-splash { position: relative; z-index: 2; text-align: center; opacity: 0; animation: logoReveal 1.2s ease forwards; animation-delay: 0.5s; }
        .logo-splash .nome { font-family: 'Playfair Display', serif; font-size: 72px; font-weight: 700; font-style: italic; color: #fff; letter-spacing: 6px; text-shadow: 0 0 40px rgba(255,26,26,0.15), 0 0 80px rgba(255,26,26,0.08); animation: textGlow 3s ease-in-out infinite; }
        .logo-splash .nome .mod-destaque { color: #ff1a1a; text-shadow: 0 0 60px rgba(255,26,26,0.4); }
        .logo-splash .underline { width: 0; height: 2px; background: linear-gradient(90deg, transparent, #ff1a1a, transparent); margin: 12px auto 0 auto; animation: underlineGrow 1.5s ease forwards; animation-delay: 1.2s; }
        .logo-splash .sub { font-size: 13px; font-weight: 300; letter-spacing: 8px; color: rgba(255,255,255,0.5); text-transform: uppercase; margin-top: 16px; opacity: 0; animation: fadeUp 0.8s ease forwards; animation-delay: 1.8s; }

        @keyframes logoReveal { 0% { opacity: 0; transform: scale(0.8) translateY(30px); filter: blur(8px); } 60% { transform: scale(1.05) translateY(-5px); filter: blur(0); } 100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
        @keyframes textGlow { 0%, 100% { text-shadow: 0 0 40px rgba(255,26,26,0.15); } 50% { text-shadow: 0 0 60px rgba(255,26,26,0.25); } }
        @keyframes underlineGrow { 0% { width: 0; opacity: 0; } 100% { width: 40%; opacity: 1; } }
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes lightPulse1 { 0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; } 50% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; } }
        @keyframes lightPulse2 { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 0.8; } }
        @keyframes lightPulse3 { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.4); opacity: 0.7; } }
        @keyframes lineMove1 { 0% { transform: translateX(-100%); opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateX(100%); opacity: 0; } }
        @keyframes lineMove2 { 0% { transform: translateX(100%); opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateX(-100%); opacity: 0; } }
        @keyframes lineMove3 { 0% { transform: translateX(-50%) scaleX(0.5); opacity: 0; } 50% { opacity: 0.5; } 100% { transform: translateX(50%) scaleX(1.5); opacity: 0; } }
        @keyframes particleFloat { 0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; } 50% { transform: translateY(-60px) scale(1.5); opacity: 1; } }
        @keyframes splashOut { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); visibility: hidden; } }

        /* ===== TOPO ===== */
        .top-bar {
            width: 100%;
            max-width: 1200px;
            padding: 14px 24px 8px 24px;
            padding-top: calc(14px + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 2;
            position: relative;
        }
        .logo-sky { display: flex; align-items: center; gap: 12px; }
        .logo-sky .icon { font-size: 28px; color: #ff1a1a; text-shadow: 0 0 30px rgba(255,26,26,0.3); }
        .logo-sky .nome { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; font-style: italic; color: #fff; letter-spacing: 3px; }
        .logo-sky .nome span { color: #ff1a1a; }
        .logo-sky .sub { font-size: 9px; font-weight: 300; letter-spacing: 4px; color: #888; text-transform: uppercase; margin-left: 4px; border-left: 1px solid #333; padding-left: 10px; }
        .top-bar .status { font-size: 11px; color: #666; letter-spacing: 2px; text-transform: uppercase; }
        .top-bar .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00ff88; margin-right: 8px; box-shadow: 0 0 20px rgba(0,255,136,0.3); animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

        .gold-line {
            width: 100%;
            max-width: 1200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), #ff1a1a, rgba(255,215,0,0.3), transparent);
            flex-shrink: 0;
            z-index: 2;
            position: relative;
            margin-bottom: 4px;
        }

        .tabs { position: absolute !important; left: -9999px !important; top: -9999px !important; opacity: 0 !important; pointer-events: none !important; height: 0 !important; overflow: hidden !important; }

        /* ===== PLAYER CONTAINER ===== */
        .player-container {
            flex: 1 0 auto;
            width: 100%;
            max-width: 1200px;
            padding: 6px 16px 16px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            position: relative;
            overflow: visible;
        }

        /* ===== DEVICE ===== */
        :root{
            --red-1:#ff1a1a;
            --red-2:#8a0000;
            --green-1:#00ff6a;
            --green-2:#00b34a;
            --green-glow:rgba(0,255,106,.55);
            --red-glow:rgba(255,26,26,.45);
            --text-dim:#9b9b9b;
            --font-display:'Rajdhani', 'Segoe UI', sans-serif;
        }

        .device{
            position:relative;
            width:100%;
            max-width:420px;
            background: radial-gradient(120% 100% at 50% 0%, #1a0303 0%, #0a0505 55%, #000 100%);
            border-radius:34px;
            padding:16px;
            box-shadow:
                0 0 0 1px #1a0000,
                0 0 40px 6px rgba(255,20,20,.35),
                0 0 90px 10px rgba(255,0,0,.12) inset,
                0 30px 60px rgba(0,0,0,.7);
            overflow: visible;
            isolation:isolate;
            z-index: 2;
        }

        .device::before{
            content:"";
            position:absolute;
            inset:0;
            border-radius:34px;
            padding:2px;
            background:linear-gradient(135deg, var(--red-1), transparent 30%, transparent 70%, var(--red-1));
            -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite:xor;
            mask-composite:exclude;
            opacity:.8;
            pointer-events:none;
            z-index:2;
            animation:edgePulse 4s ease-in-out infinite;
        }

        @keyframes edgePulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }

        .device::after{
            content:"";
            position:absolute;
            inset:0;
            background-image: repeating-linear-gradient(115deg, rgba(255,0,0,.05) 0 2px, transparent 2px 22px);
            mix-blend-mode:screen;
            pointer-events:none;
            z-index:1;
            border-radius:34px;
        }

        .corner{
            position:absolute;
            width:46px; height:46px;
            z-index:3;
            pointer-events:none;
            opacity:.85;
        }
        .corner svg{width:100%;height:100%;display:block;}
        .corner.tl{top:6px; left:6px;}
        .corner.tr{top:6px; right:6px; transform:scaleX(-1);}
        .corner.bl{bottom:6px; left:6px; transform:scaleY(-1);}
        .corner.br{bottom:6px; right:6px; transform:scale(-1,-1);}

        .screen-shell{
            position:relative;
            z-index:4;
            border-radius:20px;
            padding:3px;
            background:linear-gradient(160deg, rgba(255,40,40,.55), rgba(50,0,0,.2) 40%, rgba(255,20,20,.4));
            box-shadow:0 0 30px rgba(255,20,20,.25);
        }

        .screen{
            position:relative;
            border-radius:18px;
            overflow:hidden;
            background:#000;
            aspect-ratio: 4 / 5;
        }

        #playerMount {
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
        }

        #playerMount iframe,
        #playerMount video {
            width:100%;
            height:100%;
            border:none;
            display:block;
            background:#000;
            position:absolute;
            inset:0;
        }

        /* ===== BOTÕES DO PLAYER ===== */
        .player-buttons {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 5;
            display: flex;
            gap: 8px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .player-buttons.escondido {
            opacity: 0 !important;
            transform: scale(0.5) !important;
            pointer-events: none !important;
        }

        .fullscreen-btn,
        .stretch-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(0,255,106,.45);
            background: radial-gradient(circle at 35% 30%, #0e1f12, #061109 70%);
            box-shadow: 0 0 16px rgba(0,255,106,.3), inset 0 0 10px rgba(0,255,106,.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease;
            color: var(--green-1);
        }

        .fullscreen-btn:hover,
        .stretch-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 22px rgba(0,255,106,.5);
        }

        .fullscreen-btn:active,
        .stretch-btn:active {
            transform: scale(.94);
        }

        .fullscreen-btn svg,
        .stretch-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--green-1);
            filter: drop-shadow(0 0 4px var(--green-glow));
            fill: none;
        }

        .stretch-btn.ativo {
            background: radial-gradient(circle at 35% 30%, #00ff6a, #00b34a 70%);
            border-color: #00ff6a;
            box-shadow: 0 0 26px rgba(0,255,106,.7), inset 0 0 10px rgba(0,0,0,.3);
        }

        .stretch-btn.ativo svg {
            stroke: #000;
            filter: none;
        }

        .rec-tag{
            position:absolute;
            left:14px; top:14px;
            z-index:5;
            font-size:10.5px;
            font-weight:700;
            letter-spacing:1.5px;
            padding:5px 9px;
            border-radius:6px;
            background:rgba(0,0,0,.45);
            border:1px solid rgba(255,0,0,.4);
            color:#ff6666;
            backdrop-filter:blur(2px);
        }

        .click-catcher {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            background: transparent;
            cursor: pointer;
        }

        /* ===== SEEK BAR ===== */
        .seek-wrap{ position:relative; z-index:4; padding:18px 10px 6px; }
        .seek-track{ position:relative; height:6px; border-radius:6px; background:linear-gradient(180deg,#232323,#141414); box-shadow:inset 0 1px 3px rgba(0,0,0,.6); cursor:pointer; }
        .seek-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:6px; background:linear-gradient(90deg, var(--green-2), var(--green-1)); box-shadow:0 0 12px var(--green-glow); transition: width 0.2s linear; }
        .seek-thumb{ position:absolute; top:50%; left:0%; width:16px;height:16px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #d6ffe6, var(--green-1) 60%); box-shadow:0 0 10px 3px var(--green-glow), 0 0 0 3px rgba(0,0,0,.5); transform:translate(-50%,-50%); cursor:grab; transition: left 0.2s linear; }
        .time-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); font-variant-numeric:tabular-nums; padding:9px 4px 0; letter-spacing:.3px; }

        /* ===== CONTROLES ===== */
        .controls{ position:relative; z-index:4; display:flex; align-items:center; justify-content:center; gap:22px; padding:20px 0 8px; }
        .ctrl-btn{ position:relative; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 35% 30%, #10230f, #050a05 75%); color:var(--green-1); transition:transform .12s ease, box-shadow .12s ease; }
        .ctrl-btn.skip{ width:60px;height:60px; border-radius:50%; border:1px solid rgba(0,255,106,.4); box-shadow:0 0 14px rgba(0,255,106,.25), inset 0 0 8px rgba(0,255,106,.12); }
        .ctrl-btn.skip svg{width:24px;height:24px; filter:drop-shadow(0 0 5px var(--green-glow)); fill: currentColor;}
        .ctrl-btn.play{ width:82px;height:82px; border-radius:50%; border:2px solid var(--green-1); box-shadow: 0 0 0 6px rgba(0,255,106,.06), 0 0 26px 4px rgba(0,255,106,.45), inset 0 0 16px rgba(0,255,106,.25); }
        .ctrl-btn.play svg{width:32px;height:32px; filter:drop-shadow(0 0 6px var(--green-glow)); fill: currentColor;}
        .ctrl-btn:hover{transform:translateY(-2px);}
        .ctrl-btn:active{transform:translateY(0) scale(.94);}

        .stripes{ display:flex; gap:5px; justify-content: center; padding: 12px 0 4px; position: relative; z-index: 4; }
        .stripes span{ width:8px;height:26px; background:linear-gradient(180deg, var(--red-1), var(--red-2)); clip-path:polygon(40% 0, 100% 0, 60% 100%, 0 100%); box-shadow:0 0 8px var(--red-glow); }

        /* ===== FULLSCREEN TOTAL - VÍDEO CENTRALIZADO ===== */
        .device.fullscreen-ativo {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            padding: 0 !important;
            z-index: 999999 !important;
            background: #000 !important;
            box-shadow: none !important;
        }

        .device.fullscreen-ativo::before,
        .device.fullscreen-ativo::after { display: none !important; }

        .device.fullscreen-ativo .seek-wrap,
        .device.fullscreen-ativo .controls,
        .device.fullscreen-ativo .stripes,
        .device.fullscreen-ativo .corner,
        .device.fullscreen-ativo .rec-tag { display: none !important; }

        .device.fullscreen-ativo .screen-shell {
            padding: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            background: #000 !important;
            height: 100vh !important;
            height: 100dvh !important;
            width: 100vw !important;
            max-width: 100vw !important;
        }

        .device.fullscreen-ativo .screen {
            border-radius: 0 !important;
            aspect-ratio: auto !important;
            height: 100vh !important;
            height: 100dvh !important;
            width: 100vw !important;
            max-width: 100vw !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }

        /* PLAYER MOUNT - centraliza com position absolute */
        .device.fullscreen-ativo #playerMount {
            position: absolute !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            background: #000 !important;
            display: block !important;
            overflow: hidden !important;
        }

        /* FULLSCREEN normal (contain) - VÍDEO CENTRALIZADO */
        .device.fullscreen-ativo #playerMount iframe,
        .device.fullscreen-ativo #playerMount video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            max-height: 100dvh !important;
            object-fit: contain !important;
            display: block !important;
            background: #000 !important;
        }

        /* FULLSCREEN + STRETCH (cover - preenche tudo) */
        .device.fullscreen-ativo.stretch-ativo #playerMount iframe,
        .device.fullscreen-ativo.stretch-ativo #playerMount video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            min-width: 100vw !important;
            min-height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            object-fit: cover !important;
        }

        /* MODO STRETCH SEM FULLSCREEN (dentro do device) */
        .device.stretch-ativo:not(.fullscreen-ativo) #playerMount iframe,
        .device.stretch-ativo:not(.fullscreen-ativo) #playerMount video {
            object-fit: cover !important;
        }

        body.fullscreen-ativo { overflow: hidden !important; position: fixed !important; width: 100% !important; height: 100% !important; top: 0 !important; left: 0 !important; }
        body.fullscreen-ativo .top-bar,
        body.fullscreen-ativo .gold-line,
        body.fullscreen-ativo .footer-bar,
        body.fullscreen-ativo .tabs,
        body.fullscreen-ativo::before { display: none !important; }
        body.fullscreen-ativo .player-container {
            padding: 0 !important;
            margin: 0 !important;
            flex: none !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            z-index: 999999 !important;
        }
        body.fullscreen-ativo #btnCanais { display: none !important; }

        /* ===== ERRO / LOADING ===== */
        .erro-msg { display: flex; align-items: center; justify-content: center; height: 100%; color: #ff6b6b; font-size: 16px; text-align: center; padding: 20px; flex-direction: column; gap: 10px; font-family: 'Montserrat', sans-serif; background:#000; }
        .erro-msg .icone { font-size: 40px; }
        .erro-msg .titulo { font-size: 16px; font-weight: 700; color: #fff; }
        .erro-msg .descricao { font-size: 12px; color: #888; max-width: 250px; }

        .loading-player { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 16px; color: #666; font-family: 'Montserrat', sans-serif; background:#000; }
        .loading-player .spinner { width: 44px; height: 44px; border: 3px solid rgba(0,255,106,0.2); border-top-color: #00ff6a; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-player .texto { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

        /* ===== RODAPÉ DO APP ===== */
        .footer-bar {
            width: 100%;
            max-width: 1200px;
            padding: 4px 24px 12px 24px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 2;
            position: relative;
        }
        .footer-bar .info { font-size: 10px; color: #333; letter-spacing: 1px; text-transform: uppercase; }
        .footer-bar .info span { color: #ff1a1a; }
        .footer-bar .brand { font-family: 'Playfair Display', serif; font-size: 12px; font-style: italic; color: #222; letter-spacing: 2px; }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 600px) {
            .logo-sky .nome { font-size: 18px; }
            .logo-sky .sub { font-size: 7px; padding-left: 6px; letter-spacing: 2px; }

    <script>
        (function() {
            'use strict';

            const CANAIS = {
                sbt: { nome: 'SBT', url: 'https://www.youtube.com/embed/LLpNUqHVam8?autoplay=1&controls=1&rel=0&modestbranding=1&showinfo=0&iv_load_policy=3&enablejsapi=1' },
                redetv: { nome: 'Rede TV', url: 'https://geo.dailymotion.com/player/xgrus.html?video=kYe5OYErhldJ75Azib2&autoplay=1' },
                cultura: { nome: 'TV Cultura', url: 'https://player-tvcultura.stream.uol.com.br/live/tvcultura.m3u8', tipo: 'hls', headers: { 'Referer': 'https://www.cxtv.com.br/', 'Origin': 'https://www.cxtv.com.br' } },
                globo: { nome: 'GLOBO', url: 'https://megaflix.mgfiles.lat/ea4564eea5c614876989b6fd90ba4700/file.m3u8', tipo: 'hls' },
                canal: { nome: 'CANAL', url: 'https://www.youtube.com/embed/rEKifG2XUZg?autoplay=true&enablejsapi=1' },
                rssports: { nome: 'RS Sports 4', url: 'https://video03.logicahost.com.br/rssports4/rssports4/playlist.m3u8', tipo: 'hls' }
            };

            const ordemCanais = ['sbt', 'redetv', 'cultura', 'globo', 'canal', 'rssports'];
            let abaAtual = 'sbt';

            const playerMount = document.getElementById('playerMount');
            let playerAtual = null;

            function detectarTipoPlayer(url) {
                if (!url) return 'desconhecido';
                const u = url.toLowerCase();
                if (u.includes('youtube.com/embed') || u.includes('youtu.be') || u.includes('youtube.com/watch')) return 'youtube';
                if (u.includes('dailymotion.com')) return 'dailymotion';
                if (u.includes('vimeo.com')) return 'vimeo';
                if (u.includes('.m3u8')) return 'hls';
                if (u.includes('.ts') && !u.includes('test')) return 'hls';
                if (u.match(/\.(mp4|webm|mkv|mov|m4v|ogv)(\?|$)/)) return 'video';
                if (u.match(/\.(m3u|pls)(\?|$)/)) return 'hls';
                if (u.includes('/embed') || u.includes('/player') || u.match(/\.(html|php)(\?|$)/)) return 'iframe';
                return 'iframe';
            }

            function limparPlayer() {
                playerMount.innerHTML = '';
                if (playerAtual) {
                    if (playerAtual._hls) {
                        try { playerAtual._hls.destroy(); } catch(e){}
                        playerAtual._hls = null;
                    }
                    if (playerAtual.tagName === 'VIDEO') {
                        try { playerAtual.pause(); } catch(e){}
                    }
                    if (playerAtual.tagName === 'IFRAME') {
                        try { playerAtual.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*'); } catch(e){}
                    }
                    playerAtual = null;
                }
            }

            function criarPlayer(abaId) {
                const config = CANAIS[abaId];
                if (!config) return;

                abaAtual = abaId;
                const url = config.url;
                const tipo = config.tipo || detectarTipoPlayer(url);

                limparPlayer();

                playerMount.innerHTML = `<div class="loading-player"><div class="spinner"></div><div class="texto">Carregando ${config.nome}...</div></div>`;

                setTimeout(() => {
                    try {
                        let playerElement = null;
                        switch (tipo) {
                            case 'hls': playerElement = criarPlayerHLS(url, config); break;
                            case 'video': playerElement = criarPlayerVideo(url, config); break;
                            default: playerElement = criarIframe(url, config);
                        }

                        if (playerElement) {
                            playerMount.innerHTML = '';
                            playerMount.appendChild(playerElement);
                            playerAtual = playerElement;
                            setTimeout(() => {
                                if (playerElement.tagName === 'VIDEO') playerElement.play().catch(()=>{});
                            }, 500);
                        }
                    } catch (erro) {
                        console.error('Erro ao criar player:', erro);
                        playerMount.innerHTML = `<div class="erro-msg"><div class="icone">📡</div><div class="titulo">${config.nome} indisponível</div><div class="descricao">${erro.message}</div></div>`;
                    }
                }, 100);
            }

            function criarIframe(url, config) {
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write';
                iframe.allowFullscreen = true;
                iframe.loading = 'lazy';
                iframe.setAttribute('frameborder', '0');
                iframe.setAttribute('scrolling', 'no');
                return iframe;
            }

            function criarPlayerHLS(url, config) {
                const video = document.createElement('video');
                video.controls = false;
                video.autoplay = true;
                video.muted = false;
                video.playsInline = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                const suporteNativoHLS = video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('application/x-mpegURL');
                if (suporteNativoHLS && !window.Hls) { video.src = url; }
                else if (window.Hls && window.Hls.isSupported()) {
                    const hls = new Hls({
                        enableWorker: true, lowLatencyMode: true, backBufferLength: 90,
                        maxBufferLength: 30, maxMaxBufferLength: 60,
                        manifestLoadingTimeOut: 10000, manifestLoadingMaxRetry: 3,
                        levelLoadingTimeOut: 10000, levelLoadingMaxRetry: 3,
                        fragLoadingTimeOut: 20000, fragLoadingMaxRetry: 4,
                        xhrSetup: function(xhr, u) {
                            if (config.headers) {
                                Object.keys(config.headers).forEach(key => {
                                    try { xhr.setRequestHeader(key, config.headers[key]); } catch (e) {}
                                });
                            }
                            xhr.withCredentials = false;
                        }
                    });
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play().catch(function(e) {}); });
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                                case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                                default:
                                    hls.destroy();
                                    playerMount.innerHTML = `<div class="erro-msg"><div class="icone">📡</div><div class="titulo">${config.nome} indisponível</div><div class="descricao">Não foi possível carregar.</div></div>`;
                                    break;
                            }
                        }
                    });
                    video._hls = hls;
                } else { video.src = url; }
                return video;
            }

            function criarPlayerVideo(url, config) {
                const video = document.createElement('video');
                video.controls = false;
                video.autoplay = true;
                video.muted = false;
                video.playsInline = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.src = url;
                return video;
            }

            const playBtn = document.getElementById('playBtn');
            const iconPlay = document.getElementById('iconPlay');
            const iconPause = document.getElementById('iconPause');
            const rewindBtn = document.getElementById('rewindBtn');
            const forwardBtn = document.getElementById('forwardBtn');
            const seekTrack = document.getElementById('seekTrack');
            const seekFill = document.getElementById('seekFill');
            const seekThumb = document.getElementById('seekThumb');
            const currentTimeEl = document.getElementById('currentTime');
            const durationTimeEl = document.getElementById('durationTime');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const stretchBtn = document.getElementById('stretchBtn');
            const devicePlayer = document.getElementById('devicePlayer');
            const clickCatcher = document.getElementById('clickCatcher');
            const playerButtons = document.getElementById('playerButtons');

            let playing = true;
            let stretchAtivo = false;

            function setPlayingIcon(isPlaying) {
                iconPlay.style.display = isPlaying ? 'none' : 'block';
                iconPause.style.display = isPlaying ? 'block' : 'none';
                playing = isPlaying;
            }

            function formatTime(sec) {
                sec = Math.max(0, Math.floor(sec));
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            function renderProgress(current, duration) {
                const pct = duration ? Math.min(100, (current / duration) * 100) : 0;
                seekFill.style.width = pct + '%';
                seekThumb.style.left = pct + '%';
                seekThumb.setAttribute('aria-valuenow', Math.round(pct));
                currentTimeEl.textContent = formatTime(current);
                durationTimeEl.textContent = formatTime(duration);
            }

            function pausarVideo() {
                if (!playerAtual) return false;
                if (playerAtual.tagName === 'VIDEO') {
                    try { playerAtual.pause(); setPlayingIcon(false); return true; } catch(e) { return false; }
                }
                if (playerAtual.tagName === 'IFRAME') {
                    const src = (playerAtual.src || '').toLowerCase();
                    try {
                        if (src.includes('youtube') || src.includes('youtu.be')) {
                            playerAtual.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                        } else if (src.includes('dailymotion')) {
                            playerAtual.contentWindow.postMessage('{"event":"command","func":"pause","args":""}', '*');
                            playerAtual.contentWindow.postMessage('{"method":"pause"}', '*');
                        } else {
                            playerAtual.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                            playerAtual.contentWindow.postMessage('{"method":"pause"}', '*');
                        }
                        setPlayingIcon(false);
                        return true;
                    } catch(e) { return false; }
                }
                return false;
            }

            function despausarVideo() {
                if (!playerAtual) return false;
                if (playerAtual.tagName === 'VIDEO') {
                    try { playerAtual.play().then(() => setPlayingIcon(true)).catch(()=>{}); return true; } catch(e) { return false; }
                }
                if (playerAtual.tagName === 'IFRAME') {
                    const src = (playerAtual.src || '').toLowerCase();
                    try {
                        if (src.includes('youtube') || src.includes('youtu.be')) {
                            playerAtual.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                        } else if (src.includes('dailymotion')) {
                            playerAtual.contentWindow.postMessage('{"event":"command","func":"play","args":""}', '*');
                            playerAtual.contentWindow.postMessage('{"method":"play"}', '*');
                        } else {
                            playerAtual.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                            playerAtual.contentWindow.postMessage('{"method":"play"}', '*');
                        }
                        setPlayingIcon(true);
                        return true;
                    } catch(e) { return false; }
                }
                return false;
            }

            playBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (!playerAtual) return;
                if (playing) pausarVideo();
                else despausarVideo();
            });

            function canalAnterior() {
                const idx = ordemCanais.indexOf(abaAtual);
                if (idx === -1) return;
                const novoIdx = idx === 0 ? ordemCanais.length - 1 : idx - 1;
                trocarAba(ordemCanais[novoIdx]);
            }

            function proximoCanal() {
                const idx = ordemCanais.indexOf(abaAtual);
                if (idx === -1) return;
                const novoIdx = idx === ordemCanais.length - 1 ? 0 : idx + 1;
                trocarAba(ordemCanais[novoIdx]);
            }

            rewindBtn.addEventListener('click', function(e) { e.stopPropagation(); e.preventDefault(); canalAnterior(); });
            forwardBtn.addEventListener('click', function(e) { e.stopPropagation(); e.preventDefault(); proximoCanal(); });

            setInterval(() => {
                if (playerAtual && playerAtual.tagName === 'VIDEO') {
                    renderProgress(playerAtual.currentTime || 0, playerAtual.duration || 0);
                    setPlayingIcon(!playerAtual.paused);
                }
            }, 500);

            let dragging = false;
            function seekFromClientX(clientX) {
                if (!playerAtual || playerAtual.tagName !== 'VIDEO') return;
                const rect = seekTrack.getBoundingClientRect();
                let pct = (clientX - rect.left) / rect.width;
                pct = Math.min(1, Math.max(0, pct));
                if (playerAtual.duration) playerAtual.currentTime = pct * playerAtual.duration;
            }
            seekTrack.addEventListener('mousedown', e => { dragging = true; seekFromClientX(e.clientX); });
            window.addEventListener('mousemove', e => { if (dragging) seekFromClientX(e.clientX); });
            window.addEventListener('mouseup', () => { dragging = false; });
            seekTrack.addEventListener('touchstart', e => { dragging = true; seekFromClientX(e.touches[0].clientX); }, {passive:true});
            window.addEventListener('touchmove', e => { if (dragging) seekFromClientX(e.touches[0].clientX); }, {passive:true});
            window.addEventListener('touchend', () => { dragging = false; });

            let fullscreenAtivo = false;
            let timeoutEsconderBtn = null;

            function toggleBotoes() {
                if (playerButtons.classList.contains('escondido')) {
                    playerButtons.classList.remove('escondido');
                    agendarEsconder();
                } else {
                    playerButtons.classList.add('escondido');
                    if (timeoutEsconderBtn) clearTimeout(timeoutEsconderBtn);
                }
            }

            function agendarEsconder() {
                if (timeoutEsconderBtn) clearTimeout(timeoutEsconderBtn);
                timeoutEsconderBtn = setTimeout(function() {
                    playerButtons.classList.add('escondido');
                }, 3000);
            }

            clickCatcher.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleBotoes();
            });
            clickCatcher.addEventListener('touchend', function(e) {
                e.stopPropagation();
                e.preventDefault();
                toggleBotoes();
            });

            stretchBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                stretchAtivo = !stretchAtivo;
                if (stretchAtivo) {
                    devicePlayer.classList.add('stretch-ativo');
                    stretchBtn.classList.add('ativo');
                } else {
                    devicePlayer.classList.remove('stretch-ativo');
                    stretchBtn.classList.remove('ativo');
                }
                agendarEsconder();
            });

            fullscreenBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                toggleFullscreen();
            });

            function toggleFullscreen() {
                if (!fullscreenAtivo) {
                    devicePlayer.classList.add('fullscreen-ativo');
                    document.body.classList.add('fullscreen-ativo');
                    fullscreenAtivo = true;
                    playerButtons.classList.remove('escondido');
                    agendarEsconder();
                    if (devicePlayer.requestFullscreen) devicePlayer.requestFullscreen().catch(function() {});
                } else {
                    devicePlayer.classList.remove('fullscreen-ativo');
                    document.body.classList.remove('fullscreen-ativo');
                    fullscreenAtivo = false;
                    playerButtons.classList.remove('escondido');
                    agendarEsconder();
                    if (document.fullscreenElement) document.exitFullscreen().catch(function() {});
                }
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && fullscreenAtivo) toggleFullscreen();
            });

            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement && fullscreenAtivo) {
                    devicePlayer.classList.remove('fullscreen-ativo');
                    document.body.classList.remove('fullscreen-ativo');
                    fullscreenAtivo = false;
                    playerButtons.classList.remove('escondido');
                    agendarEsconder();
                }
            });

            const botoes = document.querySelectorAll('#tabButtons button');

            function trocarAba(abaId) {
                if (!CANAIS[abaId]) return;
                pausarVideo();
                botoes.forEach(btn => {
                    btn.classList.toggle('ativa', btn.dataset.tab === abaId);
                });
                criarPlayer(abaId);
                setPlayingIcon(true);
                playerButtons.classList.remove('escondido');
                agendarEsconder();
            }

            botoes.forEach(btn => {
                btn.addEventListener('click', function() {
                    trocarAba(this.dataset.tab);
                });
            });

            window.trocarAbaGlobal = trocarAba;
            window.abrirGavetaGlobal = function() {
                if (window.btnCanaisGlobal) window.btnCanaisGlobal.click();
            };

            setTimeout(() => {
                trocarAba('sbt');
            }, 200);

        })();
    </script>

    <script>
    (function() {
        'use strict';

        const btnCanais = document.getElementById('btnCanais');
        const gaveta = document.getElementById('gavetaCanais');
        const overlay = document.getElementById('gavetaOverlay');
        const lista = document.getElementById('gavetaLista');
        const total = document.getElementById('gavetaTotal');
        const btnClose = gaveta.querySelector('.gaveta-close');

        window.btnCanaisGlobal = btnCanais;

        function detectarCanais() {
            const botoes = document.querySelectorAll('#tabButtons button');
            lista.innerHTML = '';
            botoes.forEach(function(btn) {
                const tabId = btn.dataset.tab;
                const numero = btn.querySelector('.numero') ? btn.querySelector('.numero').textContent.trim() : '';
                const nome = btn.textContent.replace(numero, '').trim();
                const item = document.createElement('div');
                item.className = 'gaveta-item';
                item.dataset.tab = tabId;
                item.innerHTML = `
                    <span class="numero">${numero}</span>
                    <span class="nome">${nome}</span>
                    <span class="live-badge-list">● LIVE</span>
                `;
                item.addEventListener('click', function() {
                    const aba = this.dataset.tab;
                    if (typeof window.trocarAbaGlobal === 'function') window.trocarAbaGlobal(aba);
                    fecharGaveta();
                });
                lista.appendChild(item);
            });
            total.textContent = botoes.length;
        }

        function sincronizarAtivo() {
            const btnAtivo = document.querySelector('#tabButtons button.ativa');
            if (!btnAtivo) return;
            const abaAtiva = btnAtivo.dataset.tab;
            lista.querySelectorAll('.gaveta-item').forEach(function(item) {
                item.classList.toggle('ativo', item.dataset.tab === abaAtiva);
            });
        }

        function abrirGaveta() {
            gaveta.classList.add('aberta');
            overlay.classList.add('ativo');
            btnCanais.classList.add('ativo');
            sincronizarAtivo();
        }

        function fecharGaveta() {
            gaveta.classList.remove('aberta');
            overlay.classList.remove('ativo');
            btnCanais.classList.remove('ativo');
        }

        function toggleGaveta() {
            if (gaveta.classList.contains('aberta')) fecharGaveta();
            else abrirGaveta();
        }

        btnCanais.addEventListener('click', toggleGaveta);
        btnClose.addEventListener('click', fecharGaveta);
        overlay.addEventListener('click', fecharGaveta);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && gaveta.classList.contains('aberta')) fecharGaveta();
        });

        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
                if (m.attributeName === 'class') sincronizarAtivo();
            });
        });

        function observarBotoes() {
            document.querySelectorAll('#tabButtons button').forEach(function(btn) {
                observer.observe(btn, { attributes: true, attributeFilter: ['class'] });
            });
        }

        function init() {
            detectarCanais();
            observarBotoes();
            sincronizarAtivo();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            setTimeout(init, 500);
        }
    })();
    </script>

</body>
